<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Meridian</title>
<meta name="description" content="Follow our ship across the world, live.">
<meta name="theme-color" content="#04060b">
<meta property="og:title" content="Meridian · Follow our ship">
<meta property="og:description" content="See where our ship is right now and where it's heading next.">
<meta property="og:image" content="https://nitisundar.github.io/meridian/assets/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/leaflet.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>
@font-face{font-family:Inter;src:url(assets/inter.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:Serif;src:url(assets/serif.woff2) format('woff2');font-display:swap}
@font-face{font-family:Serif;src:url(assets/serif-italic.woff2) format('woff2');font-style:italic;font-display:swap}
:root{
  --bg:#04060b; --ink:#f4f8fd; --ink2:rgba(232,240,250,.82); --ink3:rgba(226,236,248,.62);
  --line:rgba(255,255,255,.09); --glass:rgba(12,18,30,.58); --glass2:rgba(20,28,44,.55);
  --sea:#7fe3ff; --gold:#f2c46d; --home:#ffb27a; --ok:#7ef0b8;
  --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#gl:active{cursor:grabbing}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);box-shadow:0 20px 60px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}

/* labels */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform,opacity;transition:opacity .35s;opacity:0}
.lb.c{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#fff;font-weight:650;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.8)}
.lb.c.big{font-size:15px;letter-spacing:.2em}
.lb.c.hi{color:var(--gold)}
.lb.s{font-family:Serif;font-style:italic;font-size:17px;color:rgba(185,225,255,.9);letter-spacing:.03em;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.lb.t{font-size:13.5px;font-weight:550;color:#fff;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.8);display:flex;align-items:center;gap:5px}
.lb.t::before{content:"";width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 6px rgba(255,255,255,.6)}
.pill{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;opacity:0;transition:opacity .4s}
.pill .in{display:flex;align-items:center;gap:8px;padding:7px 13px 7px 10px;border-radius:999px;font-size:14px;font-weight:550;white-space:nowrap;background:rgba(8,14,24,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
.pill .dot{width:8px;height:8px;border-radius:50%}
.pill small{font-weight:400;color:var(--ink2)}
.pill.ship .in{border-color:rgba(127,227,255,.35)} .pill.ship .dot{background:var(--sea);box-shadow:0 0 10px var(--sea)}
.pill.port .dot{background:#fff}
.pill.home .dot{background:var(--home);box-shadow:0 0 10px var(--home)}
.pill.next .in{border-color:rgba(242,196,109,.35)} .pill.next .dot{background:var(--gold)}

/* top bar */
#top{position:fixed;left:0;right:0;top:0;padding:calc(14px + var(--safeT)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
#brand{pointer-events:auto}
#brand h1{margin:0;font-family:Serif;font-weight:400;font-size:30px;letter-spacing:.01em;line-height:1}
#brand p{margin:6px 0 0;font-size:10.5px;letter-spacing:.26em;white-space:nowrap;text-transform:uppercase;color:var(--ink3)}
#brand p b{color:var(--sea);font-weight:600}
#tools{display:flex;gap:8px;pointer-events:auto}
.ib{width:60px;height:56px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .2s,background .2s}
.ib span{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.ib:active{transform:scale(.92)}
.ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:rgba(127,227,255,.18);border-color:rgba(127,227,255,.4)}

/* sheet */
#sheet{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safeB));border-radius:26px;z-index:6;padding:8px 20px 18px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s;max-height:78vh;overflow:hidden;display:flex;flex-direction:column}
#sheet .grab{align-self:center;width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);margin:2px 0 12px;flex:none}
#sheetBody{overflow-y:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
#sheetBody::-webkit-scrollbar{display:none}
@media(min-width:760px){#sheet{left:20px;right:auto;bottom:20px;width:400px}}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:var(--sea)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,227,255,.6)}70%{box-shadow:0 0 0 9px rgba(127,227,255,0)}100%{box-shadow:0 0 0 0 rgba(127,227,255,0)}}
.ttl{font-family:Serif;font-weight:400;font-size:36px;line-height:1.02;margin:8px 0 2px;letter-spacing:-.005em}
.sub{color:var(--ink2);font-size:15.5px}
.count{display:flex;align-items:baseline;gap:10px;margin:16px 0 4px}
.count .k{font-size:12px;color:var(--ink3);letter-spacing:.06em}
.count .v{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.count .v b{font-weight:300;color:var(--ink3);font-size:18px;margin:0 3px 0 1px}
.when{font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{height:2px;border-radius:2px;background:rgba(255,255,255,.08);margin:14px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,rgba(127,227,255,.2),var(--sea));box-shadow:0 0 12px var(--sea)}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.clk{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.clk .l{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:6px}
.clk .l svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.clk .t{font-size:22px;font-weight:300;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clk .d{font-size:13px;color:var(--ink3);margin-top:1px}
.more{max-height:0;opacity:0;transition:max-height .6s cubic-bezier(.2,.8,.2,1),opacity .4s;overflow:hidden}
#sheet.open .more{max-height:1400px;opacity:1}
.sec{margin-top:22px}
.sec h3{margin:0 0 10px;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.note{padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(242,196,109,.1),rgba(242,196,109,.03));border:1px solid rgba(242,196,109,.2);font-family:Serif;font-size:19px;line-height:1.35}
.note small{display:block;font-family:Inter;font-size:11px;color:var(--ink3);margin-top:8px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:12px;width:1px;background:linear-gradient(var(--sea),rgba(242,196,109,.5))}
.st{position:relative;padding-bottom:16px}
.st::before{content:"";position:absolute;left:-22px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1.5px solid var(--sea)}
.st.now::before{background:var(--sea);box-shadow:0 0 12px var(--sea)}
.st.prob::before{border-color:var(--gold);border-style:dashed}
.st .n{font-size:15px;font-weight:550}
.st .n em{font-style:normal;font-weight:400;color:var(--ink3);font-size:13px}
.st .m{font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.5}
.tag{display:inline-block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid rgba(242,196,109,.4);color:var(--gold);margin-left:6px;vertical-align:2px;font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;font-size:13.5px;font-weight:550;background:rgba(255,255,255,.06);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:#08101c;border-color:transparent}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:16px;font-size:12.5px;color:var(--ink3);text-align:center;letter-spacing:.02em}
.expand{display:flex;justify-content:center;margin-top:12px;padding:6px 0;font-size:12.5px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase;gap:6px;align-items:center}
.expand svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .4s}
#sheet.open .expand svg{transform:rotate(180deg)}
#sheet .grab{touch-action:none;cursor:grab;padding:8px 40px;margin:-6px 0 6px;background-clip:content-box;height:20px;width:118px;border-radius:0}
#sheet .grab::after{content:"";display:block;width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.35);margin:auto}
#peek{display:none;align-items:center;gap:10px;padding:2px 0 4px;cursor:pointer;touch-action:none}
#peek .pd{width:9px;height:9px;border-radius:50%;background:var(--sea);box-shadow:0 0 10px var(--sea);flex:none}
#peek .pt{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#peek .pt small{font-weight:400;color:var(--ink2);margin-left:6px;font-size:14px}
#peek .pr{font-size:15px;font-variant-numeric:tabular-nums;color:var(--sea);font-weight:600;white-space:nowrap}
#sheet.min #peek{display:flex} #sheet.min #sheetBody{display:none} #sheet.min{padding-bottom:12px}
#tiles{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .6s;background:#dfe6ea}
body.tiles #tiles{opacity:1;pointer-events:auto}
body.tiles #labels{opacity:0;transition:opacity .3s}
body.tiles #brand{background:rgba(10,16,28,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 14px 9px;border-radius:16px}
#tiles .leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.75)}
#tiles .leaflet-top.leaflet-left{top:calc(90px + var(--safeT))}
.lm{position:relative} .lm .pill{position:static;opacity:1;transform:translate(-50%,-140%)!important;display:inline-block}
.shipmk{width:64px;height:64px;position:relative}
.shipmk .rg{position:absolute;inset:0;border-radius:50%;border:2px solid #10a5d6;animation:ring 2.4s infinite;opacity:0}
.shipmk .rg.b{animation-delay:1.2s}
.shipmk .core{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#0aa3d8;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.mklab{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);white-space:nowrap;background:#0b1424;color:#fff;font:600 14px Inter,system-ui;padding:6px 12px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.35);margin-bottom:2px}
.mklab small{font-weight:400;opacity:.75;margin-left:5px}
.dotmk{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);position:relative}
.dotmk .mklab{margin-bottom:8px}

/* toast */
#toast{position:fixed;left:50%;top:calc(80px + var(--safeT));transform:translate(-50%,-10px);padding:10px 16px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:all .35s;z-index:7;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast b{font-weight:600} #toast span{color:var(--ink2);margin-left:8px}

/* loader */
#load{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20;transition:opacity 1.2s}
#load.gone{opacity:0;pointer-events:none}
#load .w{text-align:center}
#load h1{font-family:Serif;font-weight:400;font-size:44px;margin:0;letter-spacing:.02em}
#load p{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--ink3);margin:10px 0 22px}
#load .pr{width:140px;height:1px;background:rgba(255,255,255,.1);margin:auto;overflow:hidden}
#load .pr i{display:block;height:100%;width:0;background:var(--sea);transition:width .3s}

/* Tara mode */
#tara{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(16px + var(--safeB));z-index:6;display:none;flex-direction:column;gap:12px;align-items:stretch}
body.tara #tara{display:flex}
body.tara #sheet{opacity:0;pointer-events:none;transform:translateY(40px)}
body.tara #brand p{display:none}
#tcard{border-radius:28px;padding:20px 22px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center}
#tcard .flag{font-size:44px;line-height:1;margin-bottom:6px}
#tcard .nm{font-family:Serif;font-size:42px;line-height:1.05}
#tcard .fx{font-size:16px;color:var(--ink2);margin-top:8px;line-height:1.45}
#tbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#tbtns button{height:84px;border-radius:24px;font-size:19px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#tbtns button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tbtns .s{color:var(--sea)} #tbtns .h{color:var(--home)}
body.tara .lb.c{font-size:16px} body.tara .lb.c.big{font-size:19px}
body.tara .lb.t, body.tara .lb.s{display:none}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:.3}to{transform:none;opacity:1}}
</style>
</head>

<canvas id="gl"></canvas>
<div id="tiles"></div>
<div id="labels"></div>

<div id="top">

    <button class="ib glass" id="bTara" title="Tara mode"><svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.2 5.6.6-4.2 3.8 1.2 5.6L12 15.4 7 18.2l1.2-5.6L4 8.8l5.6-.6z"/></svg><span>Tara</span></button>
    <button class="ib glass" id="bFs" title="Full screen"><svg viewBox="0 0 24 24" id="fsIco"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Full screen</span></button>
  </div>
</div>

<div id="sheet" class="glass">
  <div class="grab" title="Slide down to hide"></div>
  <div id="peek"></div>
  <div id="sheetBody"></div>
</div>

<div id="tara">
  <div id="tcard" class="glass"></div>
  <div id="tbtns">
    <button class="glass s" id="tShip"><svg viewBox="0 0 24 24"><path d="M3 15l2 5h14l2-5zM6 15V9h9l3 6M9 9V5h4v4"/></svg>Our ship</button>
    <button class="glass h" id="tHome"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/></svg>Home</button>

</div>

<div id="toast" class="glass"></div>
<div id="load"><div class="w"><h1>Meridian</h1><p>Finding our ship</p><div class="pr"><i id="lp"></i></div></div></div>

<script src="assets/leaflet.js"></script>
<script>
setTimeout(function(){var l=document.getElementById('load');if(l&&!l.classList.contains('gone')){var p=l.querySelector('p');p.style.letterSpacing='.05em';p.style.textTransform='none';p.style.fontSize='14px';p.style.lineHeight='1.5';p.style.maxWidth='300px';p.style.margin='14px auto 22px';p.style.color='rgba(226,236,248,.7)';p.textContent=location.protocol==='https:'?'Still loading... please check your internet connection and try again.':'Meridian needs to be opened from its web link. It cannot run as a file opened on the phone.';}},12000);
</script>

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const wrap=x=>{while(x>Math.PI)x-=2*Math.PI;while(x<-Math.PI)x+=2*Math.PI;return x};
function sph(lon,lat,r=1){const c=Math.cos(lat);return new THREE.Vector3(c*Math.sin(lon)*r,Math.sin(lat)*r,c*Math.cos(lon)*r)}
let MORPH=0;
function place(lon,lat,h=0,m=MORPH){const s=sph(lon,lat,1+h);const f=new THREE.Vector3(lon,lat,h);return s.lerp(f,m)}
function sunLL(date){ // subsolar point (radians)
  const d=date.getTime()/864e5+2440587.5-2451545.0;
  const g=(357.529+0.98560028*d)*D2R, q=280.459+0.98564736*d;
  const L=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*D2R, e=(23.439-0.00000036*d)*D2R;
  const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)), dec=Math.asin(Math.sin(e)*Math.sin(L));
  const gmst=(18.697374558+24.06570982441908*d)%24;
  return [wrap(ra-gmst*15*D2R),dec];
}

function lineMat(color,alpha,h,dash=0){

  fragmentShader:`uniform vec3 uCol;uniform float uA;uniform float uDash;uniform float uTime;varying float vF;varying float vU;
   void main(){float a=uA*smoothstep(-0.02,0.25,vF);if(uDash>0.0){float k=fract(vU*uDash-uTime*0.35);a*=smoothstep(0.0,0.1,k)*smoothstep(0.65,0.45,k)*0.9+0.1;}gl_FragColor=vec4(uCol,a);}`});
}
function buildLines(rings,mat,closed=false){
  const ll=[],u=[];
  for(const r of rings){let acc=0;const n=r.length/2;
    for(let i=0;i<n-1+(closed?1:0);i++){const j=(i+1)%n;const a=[r[2*i]*D2R,r[2*i+1]*D2R],b=[r[2*j]*D2R,r[2*j+1]*D2R];
      if(Math.abs(a[0]-b[0])>Math.PI)continue;const seg=Math.hypot(a[0]-b[0],a[1]-b[1]);
      ll.push(...a,...b);u.push(acc,acc+seg);acc+=seg;}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(ll.length/2*3),3));
  g.setAttribute('ll',new THREE.Float32BufferAttribute(ll,2));g.setAttribute('u',new THREE.Float32BufferAttribute(u,1));
  const m=new THREE.LineSegments(g,mat);m.frustumCulled=false;return m;
}

const V=voyage, stops=V.stops, home=V.home;
const shipRef=()=>state.mode==='sea'?(state.f<0.5?state.from:state.next):state.mode==='departed'?state.from:(state.stop||state.next);
const tzShip=()=>{const st=shipRef();return (st&&st.tz)||'UTC'};
function fmt(d,tz,o){return new Intl.DateTimeFormat('en-GB',{timeZone:tz,...o}).format(d)}
const fTime=(d,tz)=>fmt(d,tz,{hour:'numeric',minute:'2-digit',hour12:true}).replace(' ',' ').toUpperCase();
const fDay=(d,tz)=>fmt(d,tz,{weekday:'short',day:'numeric',month:'short'});
function dur(ms){ms=Math.max(0,ms);const m=Math.round(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;
  return d?`${d}<b>d</b>${h}<b>h</b>`:h?`${h}<b>h</b>${String(mi).padStart(2,'0')}<b>m</b>`:`${mi}<b>m</b>`}
function dayWord(d,tz,now){const a=fmt(d,tz,{year:'numeric',month:'2-digit',day:'2-digit'}),b=fmt(now,tz,{year:'numeric',month:'2-digit',day:'2-digit'});
  const diff=Math.round((Date.parse(a.split('/').reverse().join('-'))-Date.parse(b.split('/').reverse().join('-')))/864e5);
  const hr=+fmt(d,tz,{hour:'numeric',hour12:false});
  if(diff===0)return hr>=18?'tonight':hr>=12?'this afternoon':'today'; if(diff===1)return hr>=18?'tomorrow night':'tomorrow'; return fDay(d,tz)}

// legs: path [[lon,lat],...] deg
function legFor(a,b){return (V.legs||[]).find(l=>l.from===a&&l.to===b)}
function pathLen(p){let s=0;for(let i=1;i<p.length;i++)s+=gc(p[i-1],p[i]);return s}
function gc(a,b){const A=sph(a[0]*D2R,a[1]*D2R),B=sph(b[0]*D2R,b[1]*D2R);return A.angleTo(B)}
function along(p,f){const L=pathLen(p)*f;let s=0;for(let i=1;i<p.length;i++){const g=gc(p[i-1],p[i]);if(s+g>=L){const t=g?(L-s)/g:0;
  const A=sph(p[i-1][0]*D2R,p[i-1][1]*D2R),B=sph(p[i][0]*D2R,p[i][1]*D2R);const q=A.clone().lerp(B,t).normalize();
  const nxt=sph(p[i][0]*D2R,p[i][1]*D2R);return {lon:Math.atan2(q.x,q.z),lat:Math.asin(q.y),toward:[Math.atan2(nxt.x,nxt.z),Math.asin(nxt.y)]}}s+=g}
  const e=p[p.length-1];return {lon:e[0]*D2R,lat:e[1]*D2R}}

const state={};
function compute(now){
  const t=now.getTime();Object.keys(state).forEach(k=>delete state[k]);
  for(let i=0;i<stops.length;i++){
    const s=stops[i],arr=s.arrive?Date.parse(s.arrive):null,dep=s.depart?Date.parse(s.depart):null,prev=stops[i-1];
    const prevDep=prev&&prev.depart?Date.parse(prev.depart):null;

    const d=new Date(st.eta);when=`${st.stop.arriveApprox?'About ':''}${fTime(d,tzS)} ${dayWord(d,tzS,now)} · ${fTime(d,tzH)} in ${home.name}`}
  else if(st.mode==='port'){chip='In port';title=st.stop.port;sub=`${st.stop.region?st.stop.region+', ':''}${st.stop.country}${st.stop.activity?' · '+st.stop.activity:''}`;
    if(st.etd){countK='Departs in';countV=dur(st.etd-now);const d=new Date(st.etd);when=`${st.stop.departApprox?'Likely ':''}${dayWord(d,tzS,now)}, ${fTime(d,tzS)} ship time`;prog=st.since?clamp((now-st.since)/(st.etd-st.since),0,1):null}
    else{countK='Alongside for';countV=st.since?dur(now-st.since):'—'}}
  else if(st.mode==='sea'){chip='At sea';title=st.next.port||st.next.country;sub=`Bound for ${st.next.port?st.next.country:'port to be confirmed'} · from ${st.from.port}`;countK='Arriving in';countV=dur(st.eta-now);prog=st.f;
    const d=new Date(st.eta);when=`About ${fTime(d,tzS)} ${dayWord(d,tzS,now)} · ${fTime(d,tzH)} in ${home.name}`}
  else{chip='At sea';title=st.next.country;sub=`Sailing from ${st.from.port} · port to be confirmed`;countK='At sea for';countV=dur(now-st.since)}
  const dS=isDay(tzS,now),dH=isDay(tzH,now);
  const note=V.note&&V.note.text?`<div class="sec"><h3>A note from the ship</h3><div class="note">${V.note.text}<small>${V.note.date?fDay(new Date(V.note.date),tzS):''}</small></div></div>`:'';
  const tlHtml=stops.map(s=>{const isNow=(st.stop===s)||(st.mode==='inbound'&&st.stop===s);
    return `<div class="st ${isNow?'now':''} ${s.probable?'prob':''}"><div class="n">${s.port||s.country}${s.port?` <em>${s.country}</em>`:''}${s.probable?'<span class="tag">Probable</span>':''}</div><div class="m">${stopLine(s,now)}</div></div>`}).join('');
  const target=st.stop||st.next;
  $('#sheetBody').innerHTML=`
   <div class="chip"><i></i>${chip}</div>
   <div class="ttl">${title}</div><div class="sub">${sub}</div>
   ${countV?`<div class="count"><span class="k">${countK}</span><span class="v">${countV}</span></div>`:''}
   ${when?`<div class="when">${when}</div>`:''}
   ${prog!=null?`<div class="bar"><i style="width:${(prog*100).toFixed(1)}%"></i></div>`:''}
   <div class="clocks">
    <div class="clk"><div class="l">${dS?ICO.sun:ICO.moon}Ship time</div><div class="t">${fTime(now,tzS)}</div><div class="d">${fDay(now,tzS)} · ${(shipRef()||{}).country||''}</div></div>
    <div class="clk"><div class="l">${dH?ICO.sun:ICO.moon}${home.name}</div><div class="t">${fTime(now,tzH)}</div><div class="d">${fDay(now,tzH)} · India</div></div>
   </div>
   <div class="expand">${ICO.chev}<span>${$('#sheet').classList.contains('open')?'Less':'Voyage & details'}</span></div>
   <div class="more">
     ${note}
     <div class="sec"><h3>Voyage</h3><div class="tl">${tlHtml}</div></div>
     <div class="acts">
       <a class="btn pri" href="${gmaps(target)}" target="_blank" rel="noopener">${ICO.map}Google Maps</a>
       <button class="btn" id="bFly">${ICO.loc}Fly to ship</button>
     </div>
     <div class="foot">Updated ${fDay(new Date(V.updated),tzS)}, ${fTime(new Date(V.updated),tzS)} ship time · times are approximate</div>
   </div>`;
  const bf=$('#bFly');if(bf)bf.onclick=e=>{e.stopPropagation();flyToShip()};
  $('.expand').onclick=()=>setSheet($('#sheet').classList.contains('open')?'':'open');
  const plain=h=>h.replace(/<b>(\w)<\/b>/g,'$1 ').trim();
  $('#peek').innerHTML=`<span class="pd"></span><span class="pt">${title}</span>${countV?`<span class="pr">${countK.replace(' in','')} ${plain(countV)}</span>`:''}<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:none;opacity:.7"><path d="M6 15l6-6 6 6"/></svg>`;
}
function setSheet(m){const sh=$('#sheet');sh.classList.remove('open','min');if(m)sh.classList.add(m);try{localStorage.setItem('meridian-sheet',m==='open'?'':m)}catch(e){}renderSheet();setTimeout(resize,30);setTimeout(resize,650)}
{const sh=$('#sheet');let g=null;
 const down=e=>{g={y:e.clientY,t:performance.now()};e.currentTarget.setPointerCapture(e.pointerId)};
 const upH=e=>{if(!g)return;const dy=e.clientY-g.y;const mode=sh.classList.contains('open')?'open':sh.classList.contains('min')?'min':'';
   if(dy>35)setSheet(mode==='open'?'':'min');else if(dy<-35)setSheet(mode==='min'?'':'open');else setSheet(mode==='min'?'':mode==='open'?'':'min');g=null};
 for(const el of [$('#sheet .grab'),$('#peek')]){el.addEventListener('pointerdown',down);el.addEventListener('pointerup',upH);el.addEventListener('pointercancel',()=>g=null)}
 try{if(localStorage.getItem('meridian-sheet')==='min')sh.classList.add('min')}catch(e){}}
function flyToShip(){flyTo(state.pos.lon,state.pos.lat,0.22,2000)}
renderSheet();setInterval(()=>{const m=state.mode,lg=state.leg;renderSheet();if(state.mode!==m||state.leg!==lg)buildRoute()},20000);

/* ============ close-up street map (Leaflet + CARTO) ============ */
const tanH=()=>2*Math.tan(camera.fov*D2R/2);
const lzFromZ=(z,lat)=>Math.log2(innerHeight*2*Math.PI*Math.max(Math.cos(lat),0.2)/(256*tanH()*z));
const zFromLz=(lz,lat)=>innerHeight*2*Math.PI*Math.max(Math.cos(lat),0.2)/(256*tanH()*Math.pow(2,lz));
let mkShip=null,tileErr=0,tileOk=false;
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initMap(){
  map=L.map('tiles',{zoomControl:false,zoomSnap:0,zoomDelta:0.5,wheelPxPerZoomLevel:100,minZoom:3,maxZoom:18,worldCopyJump:true,attributionControl:true});
  map.attributionControl.setPrefix(false);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap contributors © CARTO'})
   .on('tileerror',()=>{tileErr++;if(tileErr>3&&!tileOk){tilesBroken=true;if(tilesOn)exitTiles()}}).on('tileload',()=>tileOk=true).addTo(map);
  const dot=(lat,lon,col,html)=>L.marker([lat,lon],{icon:L.divIcon({className:'',html:`<div class="dotmk" style="background:${col}"><div class="mklab">${html}</div></div>`,iconSize:[16,16],iconAnchor:[8,8]}),interactive:false}).addTo(map);
  for(const s of stops)if(s.lat!=null&&s!==state.stop)dot(s.lat,s.lon,'#1d2b44',`${esc(s.port)}<small>${esc(s.country)}</small>`);
  dot(home.lat,home.lon,'#ff9a5a',`Home<small>${esc(home.name)}</small>`);
  mkShip=L.marker([0,0],{icon:L.divIcon({className:'',html:'<div class="shipmk"><div class="rg"></div><div class="rg b"></div><div class="core"></div><div class="mklab" id="mkShipL"></div></div>',iconSize:[64,64],iconAnchor:[32,32]}),interactive:false,zIndexOffset:1000}).addTo(map);
  map.on('zoom',()=>{if(tilesOn&&!entering&&map.getZoom()<lzFromZ(ZT*1.45,map.getCenter().lat*D2R))exitTiles()});
  map.on('click',e=>{const n=countryAt(e.latlng.lng*D2R,e.latlng.lat*D2R);if(document.body.classList.contains('tara'))taraCountry(n,[e.latlng.lng*D2R,e.latlng.lat*D2R]);else if(n)toast(`<b>${esc(NAMEFIX[n]||n)}</b>`)});
}
function enterTiles(){
  if(tilesBroken||!window.L)return;if(!map)initMap();
  tilesOn=true;entering=true;tilesT=performance.now();map.invalidateSize();
  map.setView([cam.lat/D2R,cam.lon/D2R],lzFromZ(cam.z,cam.lat),{animate:false});map.panBy([0,sheetOffset],{animate:false});
  mkShip.setLatLng([state.pos.lat/D2R,state.pos.lon/D2R]);
  const l=document.getElementById('mkShipL');if(l)l.innerHTML=esc(V.shipLabel||'Our Ship')+(state.stop?`<small>${state.mode==='inbound'?'arriving ':'at '}${esc(state.stop.port)}</small>`:'');
  document.body.classList.add('tiles');cam.vlon=cam.vlat=0;drag=null;pts.clear();pinch0=null;
  setTimeout(()=>entering=false,400);
}
function exitTiles(){
  if(!tilesOn)return;tilesOn=false;
  const c=map.containerPointToLatLng([innerWidth/2,innerHeight/2-sheetOffset]);
  cam.lon=wrap(c.lng*D2R);cam.lat=clamp(c.lat*D2R,-1.3,1.3);cam.z=Math.max(zFromLz(map.getZoom(),cam.lat),ZT*1.5);
  document.body.classList.remove('tiles');

/* ============ label layout ============ */
const tmp=new THREE.Vector3();
function layoutLabels(){
  const W=innerWidth,H=innerHeight,occ=[];for(const sel of ['#brand','#tools','#sheet','#tcard','#tbtns']){const el=$(sel);if(!el||el.offsetParent===null&&sel!=='#sheet')continue;const r=el.getBoundingClientRect();if(r.width&&getComputedStyle(el).opacity!=='0')occ.push([r.left-4,r.top-4,r.right+4,r.bottom+4])}const z=cam.z;const camP=camera.position;
  const vis=(lon,lat)=>{const p=place(lon,lat,0.002);const n=sph(lon,lat);const f=MORPH>0.5?1:n.dot(tmp.copy(camP).sub(p).normalize());tmp.copy(p).project(camera);
    return {x:(tmp.x+1)/2*W,y:(1-tmp.y)/2*H,f,ok:tmp.z<1&&f>0.08}};
  const pocc=[];let pAdded=false;
  for(const o of pills){const v=vis(o.lon,o.lat);const here=o.stop&&state.stop===o.stop;const on=!here&&v.ok&&v.x>-50&&v.x<W+50&&v.y>-50&&v.y<H+50;
    const r=o.el._w||(o.el._w=o.el.firstChild.offsetWidth);
    o.el.style.opacity=on?Math.min(1,(v.f-0.08)*4):0;
    if(on){const x=v.x-r/2+o.dx,y=v.y-14+o.dy;o.el.style.transform=`translate(${x}px,${y}px)`;pocc.push([x,y,x+r,y+28])}}
  const thr=10*z*z;const sorted=items;
  for(const it of sorted){
    if(!pAdded&&it.pri<1000){occ.push(...pocc);pAdded=true}
    let show=false;let v=null;
    const need=it.kind==='c'?thr:it.kind==='s'?thr*0.7:thr*1.6;
    if(it.pri>=need&&!(it.kind==='t'&&z>1.1)&&!(it.kind==='s'&&it.pri>100&&z<0.25)){v=vis(it.lon,it.lat);
      if(v.ok&&v.x>-80&&v.x<W+80&&v.y>-30&&v.y<H+30){
        const w=it._w||(it._w=it.el.offsetWidth||it.el.textContent.length*7.5),h=16;const x=v.x-(it.kind==='t'?4:w/2),y=v.y-h/2;
        const box=[x-6,y-3,x+w+6,y+h+3];let hit=false;for(const b of occ)if(box[0]<b[2]&&box[2]>b[0]&&box[1]<b[3]&&box[3]>b[1]){hit=true;break}
        if(!hit){occ.push(box);show=true;it.el.style.transform=`translate(${x}px,${y}px)`}}}
    const a=show?Math.min(1,(v.f-0.08)*3.5):0;if(it._a!==a){it.el.style.opacity=a;it._a=a}
  }
}
// sort items by priority descending once (countries interleaved)
items.sort((a,b)=>b.pri-a.pri);

/* ============ loop ============ */
resize();updateCamera();
const t0=performance.now();
function frame(now){
  const t=(now-t0)/1000;U.uTime.value=t;
  const [sl,sp]=sunLL(new Date());U.uSun.value.copy(sph(sl,sp));sunL.position.copy(place(sl,sp,3));
  // morph
  cam.morph+=(morphTarget-cam.morph)*0.06;if(Math.abs(cam.morph-morphTarget)<0.001)cam.morph=morphTarget;
  if(cam.morph>0.5)cam.lat=clamp(cam.lat,-1.2,1.2);
  // fly
  if(fly){const k=clamp((now-fly.t0)/fly.dur,0,1),e=ease(k);
    // arc out in altitude for long flights
    const dist=Math.hypot(wrap(fly.b.lon-fly.a.lon),fly.b.lat-fly.a.lat);const lift=Math.sin(Math.PI*e)*Math.min(dist*0.9,1.6)*(1-cam.morph*0.6);
    cam.lon=wrap(fly.a.lon+(fly.b.lon-fly.a.lon)*e);cam.lat=fly.a.lat+(fly.b.lat-fly.a.lat)*e;
    cam.z=Math.exp(Math.log(fly.a.z)+(Math.log(fly.b.z)-Math.log(fly.a.z))*e)+lift*Math.max(fly.a.z,fly.b.z,0.3)*0.6;
    if(k>=1)fly=null;}
  else if(!drag){cam.lon=wrap(cam.lon+cam.vlon);cam.lat=clamp(cam.lat+cam.vlat,-1.35,1.35);cam.vlon*=0.92;cam.vlat*=0.92}
  if(!tilesOn&&!tilesBroken&&!fly&&!drag&&!pinch0&&(cam.morph===0||cam.morph===1)&&cam.z<ZT&&window.L)enterTiles();
  if(tilesOn&&now-tilesT>800){requestAnimationFrame(frame);return}
  updateCamera();
  atmMat.uniforms.uFade.value=1-MORPH;atm.visible=MORPH<0.99;
  if(window._sky)window._sky.position.copy(camera.position);
  // ship
  const pos=state.pos;let hd=1.6;
  if(state.pos&&state.pos.toward)hd=headingTo([pos.lon,pos.lat],state.pos.toward);
  else if(state.mode==='departed'||state.mode==='port'){hd=2.4}
  const sc=clamp(cam.z*0.032,0.0006,0.03)*(document.body.classList.contains('tara')?1.8:1);
  const p=orientOnSurface(ship,pos.lon,pos.lat,0.0005,hd);ship.scale.setScalar(sc);
  const {up:upv}=frameAt(pos.lon,pos.lat,0);
  beacon.position.copy(p).addScaledVector(upv,sc*0.3);const bs=cam.z*0.06*(1+0.12*Math.sin(t*2.4));beacon.scale.setScalar(bs);beacon.material.opacity=clamp(cam.z*1.1,0.2,0.9);
  for(const [pm,ph] of [[pulse,0],[pulse2,0.5]]){const k=((t*0.45+ph)%1);orientOnSurface(pm,pos.lon,pos.lat,0.0008,0);pm.rotateX(-Math.PI/2);
    pm.scale.setScalar(cam.z*(0.03+0.13*k));pm.material.opacity=(1-k)*0.7;}
  sunL.target=ship;
  // home & ports
  homeDot.position.copy(place(home.lon*D2R,home.lat*D2R,0.002));homeDot.scale.setScalar(cam.z*0.06);
  for(const {s,sp} of portDots){sp.position.copy(place(s.lon*D2R,s.lat*D2R,0.002));sp.scale.setScalar(cam.z*0.035)}
  shipPill.lon=pos.lon;shipPill.lat=pos.lat;{const txt=(V.shipLabel||'Our Ship')+(state.stop?` <small>${state.mode==='inbound'?'arriving ':'at '}${state.stop.port}</small>`:'');if(shipPill._t!==txt){shipPill._t=txt;shipPill.el.firstChild.innerHTML='<span class="dot"></span>'+txt;shipPill.el._w=0}}
  renderer.render(scene,camera);
  layoutLabels();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__m={cam,state,flyTo,stops};
