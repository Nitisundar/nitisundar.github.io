<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd84d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Tara's Playroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="only light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: sunny toy-box home of chunky sticker tiles; each game is one full-screen stage with a slim bar on top */
:root{
  --sun:#ffd84d; --sun-deep:#f5b81f; --ink:#2b2350; --paper:#fffaf0;
  --berry:#ff5d8f; --leaf:#38c172; --sky:#4cc3ff;
  --font:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:only light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;background:var(--sun);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
#app{height:100%;position:relative}

/* ---------- Home ---------- */
#home{height:100%;overflow-y:auto;padding-block:14px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:
    radial-gradient(circle at 20px 22px,#ff6fb5 6px,transparent 7px) 0 0/120px 110px,
    radial-gradient(circle at 80px 70px,#4cc3ff 6px,transparent 7px) 0 0/120px 110px,
    radial-gradient(circle at 60px 18px,#38c172 5px,transparent 6px) 0 0/140px 130px,
    radial-gradient(circle at 30px 90px,#ff8c1a 5px,transparent 6px) 0 0/140px 130px,
    radial-gradient(circle at 100px 40px,#9b6bff 5px,transparent 6px) 0 0/160px 150px,
    linear-gradient(180deg,#ffe14d,#ffc93c)}
.inner{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:10px}
.logo span:nth-child(6n+1){color:#ff4d6d}.logo span:nth-child(6n+2){color:#ff9f1c}.logo span:nth-child(6n+3){color:#2ec4b6}
.logo span:nth-child(6n+4){color:#3a86ff}.logo span:nth-child(6n+5){color:#8338ec}.logo span:nth-child(6n){color:#38c172}
.logo{flex:1;min-width:0;margin:0;font-size:clamp(28px,7vw,46px);font-weight:800;line-height:1;letter-spacing:.5px;
  color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-wrap:balance}
.round{width:52px;height:52px;flex:none;border-radius:50%;border:3px solid var(--ink);background:#fff;
  box-shadow:0 4px 0 var(--ink);font-size:24px;display:grid;place-items:center;padding:0;position:relative;overflow:hidden}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#grownBtn .fill{position:absolute;inset:auto 0 0 0;height:0;background:var(--leaf);opacity:.55;transition:height 0s}
#grownBtn.holding .fill{height:100%;transition:height 1.4s linear}
#grownBtn span{position:relative}
#fsBtn{background:#8fdcff}#grownBtn{background:#b8f2a0}
@media (display-mode:standalone),(display-mode:fullscreen){#fsBtn{display:none}}
.surprise{border:3px solid var(--ink);border-radius:26px;background:linear-gradient(90deg,#ff4d6d,#ff9f1c,#ffd60a,#38c172,#3a86ff,#8338ec);color:#fff;font-size:clamp(26px,6vw,36px);font-weight:800;
  padding:14px 18px;box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:12px;
  -webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.surprise:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.surprise .gift{font-size:1.3em;-webkit-text-stroke:0;animation:wob 2.4s ease-in-out infinite}
.label{margin:4px 2px -6px;font-size:18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.favs{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.fav{flex:none;width:118px;border:3px solid var(--ink);border-radius:20px;background:#fff0f6;box-shadow:0 5px 0 var(--ink);
  padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.fav .ic{font-size:36px;line-height:1.1}
.fav .th{position:absolute;top:4px;right:6px;font-size:20px}
.fav .ht{position:absolute;top:4px;left:7px;font-size:16px;color:var(--berry)}
.fav .nm{font-size:14px;font-weight:700;line-height:1.1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.tile{border:3px solid var(--ink);border-radius:24px;background:var(--tc);box-shadow:0 6px 0 var(--ink);
  padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile:active,.fav:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.tile .ic{width:76px;height:76px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:42px;line-height:1}
.tile .nm{font-size:19px;font-weight:800;line-height:1.1;text-align:center;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.foot{font-size:14px;opacity:.7;text-align:center;margin-top:6px}

/* ---------- Play ---------- */
#play{height:100%;display:flex;flex-direction:column;background:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:linear-gradient(90deg,#ffd60a,#ffb3c7,#8fdcff)}
.bar .gname{flex:1;min-width:0;text-align:center;font-weight:800;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .lv{font-size:18px;letter-spacing:2px;color:var(--ink)}
#favBtn.on{background:var(--berry);color:#fff}
#favBtn.pop{animation:heartpop .5s}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;border-radius:26px 26px 0 0;background:#5ec8f2;color:var(--ink)}
#stage.dark{color:#fff}

/* shared bits */
.thing{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:pointer;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18));transition:transform .25s}
.thing.on{animation:boing .5s;filter:drop-shadow(0 0 14px #fff) drop-shadow(0 6px 0 rgba(0,0,0,.18))}
.thing.on::after{content:attr(data-n);position:absolute;right:-6%;top:-6%;font:800 22px/1 var(--font);background:#fff;color:var(--ink);
  border:3px solid var(--ink);border-radius:50%;width:36px;height:36px;display:grid;place-items:center}
.bignum{position:absolute;left:50%;top:50%;font-weight:800;font-size:min(46vmin,340px);line-height:1;color:#fff;
  -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;pointer-events:none;animation:bigpop 1.1s forwards;z-index:20}
.prompt{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-weight:800;font-size:28px;background:#fff;color:var(--ink);
  border:3px solid var(--ink);border-radius:20px;padding:2px 18px;box-shadow:0 4px 0 var(--ink);white-space:nowrap;z-index:5}
.nope{animation:shake .4s}

/* how many */
.hm{display:flex;flex-direction:column;height:100%}
.field{flex:1;position:relative}
.choices{display:flex;justify-content:center;gap:5vmin;padding:12px 12px 22px}
.choice{width:min(24vmin,130px);height:min(24vmin,130px);border-radius:28px;border:4px solid var(--ink);background:#fff;
  font-size:min(16vmin,88px);font-weight:800;line-height:1;box-shadow:0 6px 0 var(--ink)}
.choice.right{background:var(--leaf);color:#fff;animation:boing .5s}

/* sorting games */
.sort{display:flex;flex-direction:column;height:100%;justify-content:space-around;padding:12px 10px 20px;gap:10px}
.targets{display:flex;justify-content:space-evenly;align-items:flex-end;gap:3vmin;flex-wrap:wrap}
.target{display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .2s}
.target.yes{animation:boing .45s}
.slot{display:flex;flex-wrap:wrap-reverse;justify-content:center;align-items:flex-end;gap:2px;min-height:12vmin;max-width:34vmin}
.items{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4vmin;min-height:22vmin}
.piece{touch-action:none;cursor:grab;position:relative;z-index:2;line-height:1}
.piece.dragging{z-index:50;cursor:grabbing;filter:drop-shadow(0 12px 6px rgba(0,0,0,.3))}
.piece.placed{cursor:default}
.ball{width:16vmin;height:16vmin;border-radius:50%;border:3px solid var(--ink);
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.75) 0 12%,transparent 13%),var(--c)}
.slot .ball{width:8vmin;height:8vmin;border-width:2px}
.bucket svg{width:min(28vmin,170px);height:auto;display:block}
/* shapes */
.hole .slot{position:absolute;inset:0;display:grid;place-items:center;min-height:0;max-width:none;z-index:3}
.hole .slot .piece{position:absolute}
.shp svg,.hole svg{width:min(24vmin,150px);height:min(24vmin,150px);display:block}
.shp{filter:drop-shadow(0 5px 0 rgba(0,0,0,.2))}
/* big & small */
.box{border:4px solid var(--ink);border-radius:20px;background:rgba(255,255,255,.55);box-shadow:0 6px 0 var(--ink)}
.box .slot{width:100%;height:100%;max-width:none;align-items:center;align-content:center}
.bigbox{width:min(42vmin,260px);height:min(42vmin,260px)}
.smallbox{width:min(22vmin,130px);height:min(22vmin,130px)}
.box .tlabel{position:absolute;bottom:-34px;font-weight:800;font-size:22px}
.piece.big{font-size:min(22vmin,150px)}
.piece.small{font-size:min(9vmin,60px)}
.bigbox .slot .piece{font-size:min(16vmin,100px)}
.smallbox .slot .piece{font-size:min(7vmin,44px)}
/* feelings */
.feelbox{width:min(36vmin,220px);height:min(36vmin,220px);border:4px solid var(--ink);border-radius:50%;box-shadow:0 6px 0 var(--ink);display:grid;place-items:center}
.feelbox .tlabel{font-size:min(16vmin,100px);line-height:1;position:absolute;opacity:.35}
.feelbox .slot{position:relative;z-index:2;max-width:80%}
.happy{background:#ffe066}.sad{background:#8ecbff}
.face-e{font-size:min(17vmin,110px)}
.feelbox .slot .face-e{font-size:min(9vmin,56px)}

/* rainbow */
.rb{display:flex;flex-direction:column;height:100%;justify-content:space-between;padding:16px 10px 24px}
.rb svg{width:100%;max-height:60%;display:block}
.rb .arcbase{fill:none;stroke:rgba(255,255,255,.5);stroke-width:17;stroke-linecap:round}
.rb .arcbase.glow{stroke:#fff;animation:glow 1s ease-in-out infinite}
.rb .arcfill{fill:none;stroke-width:17;stroke-linecap:round;transition:stroke-dashoffset .7s ease-out}
.rb .sun{opacity:0;transition:opacity .5s,transform .6s;transform-origin:center;transform:scale(.3)}
.rb .sun.show{opacity:1;transform:scale(1)}
.blobs{display:flex;justify-content:center;gap:5vmin;flex-wrap:wrap}
.blob{width:min(22vmin,120px);height:min(22vmin,120px);border-radius:50%;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.7) 0 12%,transparent 13%),var(--c)}

/* pairs */
.pairs{display:grid;gap:3vmin;place-content:center;height:100%;padding:14px}
.card{width:var(--cs);height:var(--cs);perspective:600px;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border:4px solid var(--ink);border-radius:20px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 5px 0 var(--ink)}
.card .f{background:repeating-linear-gradient(45deg,#fff 0 12px,#ffe9a8 12px 24px);font-size:calc(var(--cs)*.4);font-weight:800;color:var(--berry)}
.card .b{background:#fff;transform:rotateY(180deg);font-size:calc(var(--cs)*.6);line-height:1}
.card.got .b{background:#d7ffd9;animation:boing .5s}

/* letters */
.lhint{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);
  border:4px solid var(--ink);border-radius:24px;padding:4px 18px;box-shadow:0 5px 0 var(--ink);z-index:5}
.lbig{font-size:min(16vmin,90px);font-weight:800;line-height:1}
.lpic{font-size:min(12vmin,66px);line-height:1}
.bubbles{position:absolute;inset:min(24vmin,130px) 0 0 0}
.bub{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:4px solid rgba(255,255,255,.95);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 9%,rgba(255,255,255,.25) 10% 55%,rgba(255,255,255,.45) 100%);
  display:grid;place-items:center;font-weight:800;color:var(--ink);animation:float 3s ease-in-out infinite;cursor:pointer}
.bub span{font-size:.55em;line-height:1}
.bub.popped{animation:bubpop .45s forwards}
.bub.nope{animation:shake .4s}

/* trace */
.trace{height:100%;display:grid;place-items:center;padding:12px}
.trace svg{width:min(92vw,92%,560px);height:min(80%,560px);touch-action:none}
.tguide{fill:none;stroke:rgba(255,255,255,.85);stroke-width:17;stroke-linecap:round;stroke-linejoin:round}
.tdash{fill:none;stroke:rgba(43,35,80,.45);stroke-width:2.2;stroke-dasharray:1.5 5;stroke-linecap:round}
.tink{fill:none;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.tstart{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.trace svg.done .tink{stroke-width:17}
.trace svg.done{animation:boing .6s}

/* animals */
.an{display:flex;flex-direction:column;height:100%;align-items:center;justify-content:space-around;padding:14px}
.say{border:4px solid var(--ink);background:#fff;color:var(--ink);border-radius:30px;padding:8px 22px;font-size:min(9vmin,44px);font-weight:800;box-shadow:0 5px 0 var(--ink)}
.anrow{display:flex;flex-wrap:wrap;justify-content:center;gap:4vmin}
.anb{width:min(30vmin,170px);height:min(30vmin,170px);border-radius:50%;border:4px solid var(--ink);background:#fff;font-size:min(19vmin,110px);line-height:1;box-shadow:0 6px 0 var(--ink);padding:0}
.anb.right{background:#d7ffd9;animation:boing .6s}
.anb.nope{animation:shake .4s}

/* puzzle */
.pz{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:space-around;padding:12px}
.pboard{display:grid;border:4px solid var(--ink);border-radius:10px;position:relative;background:rgba(255,255,255,.35);box-shadow:0 6px 0 var(--ink)}
.pboard::before{content:"";position:absolute;inset:0;background:var(--img) center/100% 100%;opacity:.2;pointer-events:none}
.pslot{outline:2px dashed rgba(43,35,80,.45);outline-offset:-2px;position:relative}
.pslot .ppiece{position:absolute;inset:0}
.ptray{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.ppiece{background-image:var(--img);background-repeat:no-repeat;border:2px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pslot .ppiece{border:0;box-shadow:none}
.pboard.done{animation:boing .6s}

/* peekaboo */
.peek{position:absolute;inset:12px;border-radius:28px;overflow:hidden;border:4px solid var(--ink);background:#fff}
.pk-animal{position:absolute;inset:0;display:grid;place-items:center;font-size:min(58vmin,360px);line-height:1}
.pk-animal.hello{animation:boing .7s 2}
.peek canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .6s;touch-action:none}
.peek canvas.gone{opacity:0}
.pk-hand{position:absolute;left:50%;top:60%;font-size:64px;pointer-events:none;animation:wipe 1.6s ease-in-out infinite}

/* body */
.bd{display:flex;flex-direction:column;align-items:center;height:100%;padding:10px 10px 16px;gap:8px}
.bd .ask{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:2px 18px;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:min(8vmin,36px)}
.bd .ask b{font-size:1.4em}
.face{flex:1;min-height:0;width:100%;max-width:520px}
.face [data-part]{cursor:pointer;transform-box:fill-box;transform-origin:center}
.face [data-part].yes{animation:boing .5s 2}

/* celebration */
#party{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:rgba(255,216,77,.25)}
.yay{font-size:min(22vmin,150px);font-weight:800;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);animation:yay .7s cubic-bezier(.3,1.7,.5,1) both;text-align:center;line-height:1}
.lvup{position:absolute;top:62%;font-size:min(8vmin,40px);font-weight:800;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:2px 18px;box-shadow:0 5px 0 var(--ink);animation:yay .7s .2s both}
.conf{position:absolute;top:-12vmin;animation:fall linear forwards;line-height:1}

/* grown-ups */
#grown{position:fixed;inset:0;z-index:120;background:rgba(43,35,80,.55);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);width:min(520px,100%);max-height:86vh;overflow:auto;padding:16px 18px 20px;user-select:text}
.panel h2{margin:0 0 6px;font-size:26px}
.panel p{margin:4px 0 10px;font-size:15px;line-height:1.35}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:2px dashed rgba(43,35,80,.15);font-size:17px;font-weight:700}
.seg{display:flex;gap:6px;flex:none}
.seg button,.tog,.pbtn{border:2.5px solid var(--ink);background:#fff;border-radius:12px;min-width:40px;height:40px;font-weight:800;font-size:16px;padding:0 10px}
.seg button.on,.tog.on{background:var(--leaf);color:#fff}
.pbtn{background:var(--sun);margin-top:12px;width:100%;height:48px;font-size:18px}
.pbtn.warn{background:#ffd6de}

@keyframes boing{0%{scale:1}30%{scale:1.3}55%{scale:.9}80%{scale:1.08}100%{scale:1}}
@keyframes bigpop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}45%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.05);opacity:0}}
@keyframes shake{0%,100%{translate:0}20%{translate:-10px}40%{translate:10px}60%{translate:-7px}80%{translate:6px}}
@keyframes wob{0%,100%{rotate:-8deg}50%{rotate:8deg}}
@keyframes heartpop{40%{scale:1.35}}
@keyframes glow{50%{stroke:rgba(255,255,255,.35)}}
@keyframes float{0%,100%{margin-top:-6px}50%{margin-top:6px}}
@keyframes bubpop{40%{scale:1.3;opacity:1}100%{scale:1.6;opacity:0}}
@keyframes pulse{50%{scale:1.35}}
@keyframes wipe{0%,100%{transform:translate(-90%,-50%) rotate(-15deg)}50%{transform:translate(10%,-50%) rotate(15deg)}}
@keyframes yay{0%{scale:.2;opacity:0}100%{scale:1;opacity:1}}
@keyframes fall{to{transform:translateY(125vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>

<div id="app">
  <section id="home">
    <div class="inner">
      <div class="top">
        <h1 class="logo" aria-label="Tara's Playroom"><span>T</span><span>a</span><span>r</span><span>a</span><span>'</span><span>s</span> <span>P</span><span>l</span><span>a</span><span>y</span><span>r</span><span>o</span><span>o</span><span>m</span></h1>
        <button class="round" id="fsBtn" aria-label="Full screen"><span>⛶</span></button>
        <button class="round" id="grownBtn" aria-label="Grown-ups: hold to open"><span class="fill"></span><span>⚙️</span></button>
      </div>
      <button class="surprise" id="surprise"><span class="gift">🎁</span>Surprise me!</button>
      <div id="favWrap" hidden>
        <div class="label">♥ Favourites</div>
        <div class="favs" id="favs"></div>
      </div>
      <div class="label">All games</div>
      <div class="grid" id="grid"></div>
      <div class="foot">Grown-ups: hold ⚙️ for settings and levels.</div>
    </div>
  </section>

  <section id="play" hidden>
    <div class="bar">
      <button class="round" id="homeBtn" aria-label="Home">🏠</button>
      <div class="gname" id="gname"></div>
      <div class="lv" id="lv"></div>
      <button class="round" id="favBtn" aria-label="Save as favourite">♡</button>
    </div>
    <div id="stage"></div>
  </section>

  <div id="party" hidden></div>
  <div id="grown" hidden></div>
</div>

const TRACE_LV=[['1','I','L','T','7'],['A','V','4','E','F','H'],['C','O','U','2','3','5','0']];
function resample(s,step){const out=[s[0]];for(let i=1;i<s.length;i++){const[x0,y0]=s[i-1],[x1,y1]=s[i];const n=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/step));for(let k=1;k<=n;k++)out.push([x0+(x1-x0)*k/n,y0+(y1-y0)*k/n])}return out}
const dOf=p=>'M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L');
G.trace=(st,ctx)=>{
  const pool=TRACE_LV.slice(0,ctx.level).flat();const g=pick(pool);const strokes=GLYPHS[g].map(s=>resample(s,3.5));const spoken=GSAY[g]||g;
  const col=pick(COLORS.filter(c=>c.n!=='yellow')).c;
  const wrap=h('div','trace');st.append(wrap);
  let s=`<svg viewBox="-6 -6 112 112">`;
  strokes.forEach(p=>{s+=`<path class="tguide" d="${dOf(p)}"/>`});
  strokes.forEach(p=>{s+=`<path class="tdash" d="${dOf(p)}"/>`});
  strokes.forEach((p,i)=>{s+=`<path class="tink" id="ti${i}" stroke="${col}" d=""/>`});
  s+=`<circle class="tstart" r="6.5" fill="#38c172" stroke="#2b2350" stroke-width="2"/><circle class="tfinger" r="4" fill="#fff" opacity="0"/></svg>`;
  wrap.innerHTML=s;const svg=wrap.querySelector('svg');const dot=svg.querySelector('.tstart'),fin=svg.querySelector('.tfinger');
  const hit=strokes.map(p=>p.map(()=>false));const total=hit.flat().length;let got=0,down=false,last=null,finished=false;
  function redraw(){strokes.forEach((p,j)=>{let d='',run=false;p.forEach((q,i)=>{if(hit[j][i]){d+=(run?' L':' M')+q[0].toFixed(1)+' '+q[1].toFixed(1);run=true}else run=false});svg.querySelector('#ti'+j).setAttribute('d',d)});
    for(let j=0;j<strokes.length;j++){const i=hit[j].indexOf(false);if(i>=0){dot.setAttribute('cx',strokes[j][i][0]);dot.setAttribute('cy',strokes[j][i][1]);dot.style.display='';return}}dot.style.display='none'}
  function toSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:0,y:0}}
  function touch(x,y){strokes.forEach((p,j)=>p.forEach((q,i)=>{if(!hit[j][i]&&Math.hypot(q[0]-x,q[1]-y)<11){hit[j][i]=true;got++;if(got%6===0)sfx.tick(got/6)}}))}
  function feed(e){const p=toSvg(e);fin.setAttribute('cx',p.x);fin.setAttribute('cy',p.y);
    if(last){const dd=Math.hypot(p.x-last.x,p.y-last.y),n=Math.ceil(dd/2.5);for(let k=1;k<=n;k++)touch(last.x+(p.x-last.x)*k/n,last.y+(p.y-last.y)*k/n)}else touch(p.x,p.y);
    last=p;redraw();if(!finished&&got/total>=.82){finished=true;hit.forEach(a=>a.fill(true));redraw();svg.classList.add('done');dot.style.display='none';sfx.good();say(spoken+'!');ctx.later(ctx.done,1300)}}
  svg.addEventListener('pointerdown',e=>{e.preventDefault();actx();down=true;last=null;try{svg.setPointerCapture(e.pointerId)}catch(_){}fin.setAttribute('opacity','.9');feed(e)});
  svg.addEventListener('pointermove',e=>{if(!down||finished)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];(evs.length?evs:[e]).forEach(feed)});
  const end=()=>{down=false;last=null;fin.setAttribute('opacity','0')};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  redraw();say(`Trace ${spoken}!`);
};

function starPath(){let d='';for(let i=0;i<10;i++){const r=i%2?21:47;const a=(-90+i*36)*Math.PI/180;d+=(i?'L':'M')+(50+r*Math.cos(a)).toFixed(1)+' '+(54+r*Math.sin(a)).toFixed(1)}return d+'Z'}
const SHAPES={circle:'<circle cx="50" cy="50" r="42"/>',square:'<rect x="10" y="10" width="80" height="80" rx="10"/>',triangle:'<path d="M50 8 L94 88 L6 88Z"/>',
  star:`<path d="${starPath()}"/>`,heart:'<path d="M50 90 C20 66 5 50 9 31 C13 12 38 9 50 27 C62 9 87 12 91 31 C95 50 80 66 50 90Z"/>',diamond:'<path d="M50 4 L94 50 L50 96 L6 50Z"/>'};
const shapeSvg=(n,fill,stroke,dash)=>`<svg viewBox="0 0 100 100"><g fill="${fill}" stroke="${stroke}" stroke-width="5" stroke-linejoin="round"${dash?' stroke-dasharray="7 6"':''}>${SHAPES[n]}</g></svg>`;

function drawPic(e,theme,S){const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  const gr=g.createRadialGradient(S*.35,S*.3,S*.05,S/2,S/2,S*.75);gr.addColorStop(0,theme.bg[0]);gr.addColorStop(1,theme.bg[1]);g.fillStyle=gr;g.fillRect(0,0,S,S);
  g.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<14;i++){g.beginPath();g.arc(Math.random()*S,Math.random()*S,6+Math.random()*16,0,7);g.fill()}
  g.font=`${S*.66}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,S/2,S*.54);
  return c.toDataURL('image/png')}
G.puzzle=(st,ctx)=>{
  const [cols,rows]=[[2,1],[3,1],[2,2]][ctx.level-1];const e=Math.random()<.5?pick(ctx.theme.items):pick(ANIMALS)[0];
  const W=st.clientWidth,H=st.clientHeight;const S=Math.floor(Math.min(W*.84,H*.5));const img=drawPic(e,ctx.theme,600);
  const wrap=h('div','pz'),board=h('div','pboard'),tray=h('div','ptray');wrap.append(board,tray);st.append(wrap);
  wrap.style.setProperty('--img',`url(${img})`);board.style.cssText=`width:${S}px;height:${S}px;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)`;
  const pw=S/cols,ph=S/rows;const slots=[];
  for(let i=0;i<cols*rows;i++){const sl=h('div','pslot');sl.dataset.key=i;board.append(sl);slots.push(sl)}
  const trayH=H-S-60;const f=Math.min(1,(trayH*.9)/ph,(W*.9/(cols*rows))/pw*1.2);
  const size=(p,i,k)=>{const c=i%cols,r=Math.floor(i/cols);p.style.width=pw*k+'px';p.style.height=ph*k+'px';p.style.backgroundSize=`${S*k}px ${S*k}px`;p.style.backgroundPosition=`${-c*pw*k}px ${-r*ph*k}px`};
  let left=cols*rows;
  shuffle([...Array(cols*rows).keys()]).forEach(i=>{const p=h('div','piece ppiece');size(p,i,f);tray.append(p);
    drag(p,(x,y)=>{const t=nearest(slots,x,y);if(!t)return false;if(+t.dataset.key!==i){sfx.soft();return false}
      p.classList.add('placed');p.style.transition='none';p.style.transform='';size(p,i,1);t.append(p);sfx.good();
      if(--left===0){board.classList.add('done');say((nameOf(e)||'Yay')+'!');ctx.later(ctx.done,1300)}return true})});
};

G.peek=(st,ctx)=>{
  const a=pick(ANIMALS);const box=h('div','peek'),an=h('div','pk-animal',a[0]),cv=document.createElement('canvas'),hand=h('div','pk-hand','👆');
  box.append(an,cv,hand);st.append(box);const W=box.clientWidth,H=box.clientHeight;cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const base=pick(['#b7e4ff','#ffd0e1','#d6c8ff','#c6f2d8','#ffe2b8']);g.fillStyle=base;g.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){g.fillStyle=`rgba(255,255,255,${.25+Math.random()*.4})`;g.beginPath();g.arc(Math.random()*W,Math.random()*H,20+Math.random()*60,0,7);g.fill()}
  g.font=`800 ${Math.min(W,H)*.5}px ${getComputedStyle(document.body).fontFamily}`;g.textAlign='center';g.textBaseline='middle';g.fillStyle='rgba(43,35,80,.18)';g.fillText('?',W/2,H/2);
  let down=false,last=null,moves=0,done=false;const brush=Math.max(46,Math.min(W,H)*.14);
  function cleared(){try{const d=g.getImageData(0,0,W,H).data;let n=0,t=0;for(let y=4;y<H;y+=12)for(let x=4;x<W;x+=12){t++;if(d[(y*W+x)*4+3]<40)n++}return n/t}catch(e){return 1}}
  function wipe(x,y){g.globalCompositeOperation='destination-out';g.lineCap='round';g.lineWidth=brush;g.beginPath();if(last){g.moveTo(last.x,last.y)}else g.moveTo(x-.1,y);g.lineTo(x,y);g.stroke();last={x,y};
    if(++moves%8===0){sfx.tick(moves%20);if(!done&&cleared()>.45){done=true;cv.classList.add('gone');an.classList.add('hello');sfx.yay();say(`Peekaboo! It's a ${a[1]}! ${a[2]}`);ctx.later(ctx.done,2600)}}}
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();actx();down=true;last=null;hand.remove();try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);wipe(p.x,p.y)});
  cv.addEventListener('pointermove',e=>{if(!down||done)return;const p=pos(e);wipe(p.x,p.y)});
  const end=()=>{down=false;last=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  ctx.later(()=>say("Who's hiding?"),300);
};

/* ---------- flow ---------- */
const stage=$('#stage');let cur={game:null,theme:null,fixed:null},roundNo=0,pushed=false,lastTheme=null,wake=null;
function chooseTheme(){if(cur.fixed){const t=THEMES.find(x=>x.name===cur.fixed);if(t)return t}let t;do{t=pick(THEMES)}while(THEMES.length>1&&t===lastTheme);lastTheme=t;return t}
function newRound(keepTheme){
  const id=++roundNo;if(!keepTheme||!cur.theme)cur.theme=chooseTheme();
  const th=cur.theme;stage.innerHTML='';stage.className=th.dark?'dark':'';
  stage.style.background=`radial-gradient(circle at 30% 18%,${th.bg[0]},${th.bg[1]})`;
  const lvl=getLevel(cur.game);$('#lv').textContent='★'.repeat(lvl)+'☆'.repeat(3-lvl);updateFavBtn();
  try{speechSynthesis.cancel()}catch(e){}
  const ctx={level:lvl,theme:th,ended:false,
    alive:()=>id===roundNo&&!$('#play').hidden,
    later:(fn,ms)=>setTimeout(()=>{if(ctx.alive())fn()},ms),
    done:()=>{if(!ctx.alive()||ctx.ended)return;ctx.ended=true;const up=bumpWins(cur.game);celebrate(up,()=>{if(ctx.alive())newRound()})}};
  try{G[cur.game](stage,ctx)}catch(err){console.error(err);stage.innerHTML='<div class="prompt">Oops! Tap 🏠</div>'}
}
function celebrate(up,cb){
  const ov=$('#party');ov.innerHTML='';ov.hidden=false;
  const w=pick(['Yay!','Hooray!','Well done!','Super!','Wow!']);ov.append(h('div','yay',w));if(up)ov.append(h('div','lvup','⭐ Level up! ⭐'));
  const em=[...cur.theme.items,'⭐','🎉','✨','💛'];
  for(let i=0;i<26;i++){const c=h('span','conf',pick(em));c.style.cssText=`left:${Math.random()*100}%;font-size:${5+Math.random()*7}vmin;animation-duration:${1.4+Math.random()*1.2}s;animation-delay:${Math.random()*.5}s;--r:${rnd(720)-360}deg`;ov.append(c)}
  sfx.yay();say(Math.random()<.45?w.replace('!','')+', Tara!':w);
  setTimeout(()=>{ov.hidden=true;ov.innerHTML='';cb()},2300);
}
function isStandalone(){try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches}catch(e){return false}}
function goFull(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
function startGame(id,themeName){
  actx();cur.game=id;cur.fixed=themeName||null;cur.theme=null;
  $('#gname').textContent=gameById(id).name;$('#home').hidden=true;$('#play').hidden=false;
  if(settings.autoFull&&!isStandalone())goFull();
  try{if(navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(w=>{wake=w;w.addEventListener('release',()=>wake=null)}).catch(()=>{})}catch(e){}
  if(!pushed){try{history.pushState({tp:'play'},'');pushed=true}catch(e){}}
  newRound();
}
function showHome(){roundNo++;try{speechSynthesis.cancel()}catch(e){}$('#party').hidden=true;$('#play').hidden=true;$('#home').hidden=false;stage.innerHTML='';renderHome()}
window.addEventListener('popstate',()=>{pushed=false;if(!$('#grown').hidden){$('#grown').hidden=true;return}if(!$('#play').hidden)showHome()});
onTap($('#homeBtn'),()=>{if(pushed){try{history.back()}catch(e){pushed=false;showHome()}}else showHome()});

/* favourites */
const favKey=()=>cur.game+'|'+(cur.theme&&cur.theme.name);
function updateFavBtn(){const on=favs.some(f=>f.key===favKey());const b=$('#favBtn');b.classList.toggle('on',on);b.textContent=on?'♥':'♡'}
onTap($('#favBtn'),()=>{const k=favKey();const i=favs.findIndex(f=>f.key===k);
  if(i>=0)favs.splice(i,1);else{favs.unshift({key:k,game:cur.game,theme:cur.theme.name});sfx.good()}
  store.set('favs',favs);updateFavBtn();const b=$('#favBtn');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')});

function renderHome(){
  const grid=$('#grid');grid.innerHTML='';
  GAMES.forEach(g=>{const b=h('button','tile',`<span class="ic">${g.icon}</span><span class="nm">${g.name}</span>`);b.style.setProperty('--tc',g.col);b.addEventListener('click',()=>startGame(g.id));grid.append(b)});
  const fw=$('#favs');fw.innerHTML='';$('#favWrap').hidden=!favs.length;
  favs.forEach(f=>{const g=gameById(f.game),t=THEMES.find(x=>x.name===f.theme);if(!g||!t)return;
    const b=h('button','fav',`<span class="ht">♥</span><span class="th">${t.items[0]}</span><span class="ic">${g.icon}</span><span class="nm">${g.name}<br>${t.label}</span>`);
    b.addEventListener('click',()=>startGame(f.game,f.theme));fw.append(b)});
}
$('#surprise').addEventListener('click',()=>startGame(pick(GAMES).id));
$('#fsBtn').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen().catch(()=>{})}else goFull()});

/* grown-ups: hold to open */
(()=>{const b=$('#grownBtn');let t=null;
  const start=e=>{e.preventDefault();b.classList.add('holding');t=setTimeout(()=>{b.classList.remove('holding');openGrown()},1400)};
  const stop=()=>{clearTimeout(t);b.classList.remove('holding')};
  b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('contextmenu',e=>e.preventDefault())})();
function openGrown(){
  const p=$('#grown');p.hidden=false;
  const tog=(k,lab)=>`<div class="row">${lab}<button class="tog${settings[k]?' on':''}" data-k="${k}">${settings[k]?'On':'Off'}</button></div>`;
  let html=`<div class="panel"><h2>Grown-ups</h2><p>Each game levels up by itself after 3 wins. You can set levels here too.</p>
   ${tog('sound','Sounds')}${tog('voice','Voice')}${tog('autoFull','Full screen when a game starts')}<div class="label" style="margin:14px 0 2px">Levels</div>`;
  GAMES.forEach(g=>{const l=getLevel(g.id);html+=`<div class="row"><span>${g.icon} ${g.name}</span><div class="seg">${[1,2,3].map(n=>`<button data-g="${g.id}" data-l="${n}" class="${n===l?'on':''}">${n}</button>`).join('')}</div></div>`});
  html+=`<button class="pbtn warn" id="clrFav">Clear favourites (${favs.length})</button><button class="pbtn" id="closeG">Done</button>
   <p style="margin-top:12px;opacity:.75">Tip: add this page to the home screen so it opens full screen.</p></div>`;
  p.innerHTML=html;
  p.querySelectorAll('.tog').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;settings[k]=!settings[k];store.set('settings',settings);b.classList.toggle('on',settings[k]);b.textContent=settings[k]?'On':'Off'}));
  p.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{levels[b.dataset.g]=+b.dataset.l;wins[b.dataset.g]=0;store.set('levels',levels);store.set('wins',wins);
    b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}));
  $('#clrFav').addEventListener('click',e=>{favs=[];store.set('favs',favs);e.target.textContent='Favourites cleared';renderHome()});
  $('#closeG').addEventListener('click',()=>{p.hidden=true});
  p.addEventListener('click',e=>{if(e.target===p)p.hidden=true});
}

/* restart round on rotation */
let orient=innerWidth>innerHeight,rt=null;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const o=innerWidth>innerHeight;if(o!==orient){orient=o;if(!$('#play').hidden&&$('#party').hidden)newRound(true)}},350)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('#play').hidden&&!wake&&navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})});

renderHome();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>

</html>
